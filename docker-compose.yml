version: '3.8'

services:
  # 1. PostgreSQL Database with PostGIS Geospatial Extension
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cris_postgres
    restart: always
    environment:
      POSTGRES_DB: crisis_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crisis_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Intelligence Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cris_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/crisis_db
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  # 3. React Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cris_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
